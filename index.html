<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Accueil TV · lecteur</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100%;height:100%}</style>
</head>
<body>
<!-- Page relais du lecteur YouTube d'Accueil TV : elle contient le lecteur officiel et obéit à l'appli de la télé. -->
<div id="p"></div>
<script>
var P = null;
function envoyer(o) { o.acctv = 1; try { parent.postMessage(JSON.stringify(o), '*'); } catch (e) {} }
window.onYouTubeIframeAPIReady = function () {
  P = new YT.Player('p', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, rel: 0, playsinline: 1, modestbranding: 1 },
    events: {
      onReady: function () { envoyer({ type: 'ready' }); },
      onStateChange: function (e) { envoyer({ type: 'state', data: e.data }); },
      onError: function (e) { envoyer({ type: 'error', data: e.data }); }
    }
  });
};
setInterval(function () {
  if (P && P.getCurrentTime) envoyer({ type: 'time', t: P.getCurrentTime() || 0, d: P.getDuration() || 0, muted: P.isMuted() });
}, 1000);
window.addEventListener('message', function (e) {
  var m; try { m = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
  if (!m || !m.acctv || !P || typeof P[m.cmd] !== 'function') return;
  P[m.cmd].apply(P, m.args || []);
});
var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
envoyer({ type: 'loaded' });
</script>
</body>
</html>
